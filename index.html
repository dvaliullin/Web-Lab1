<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="main-header">
        <div class="header-title">Валиуллин Даниил Равилевич, P3231</div>
        <div class="header-subtitle">Вариант: 22709</div>
    </header>

    <div class="layout-wrapper">
        <main class="content-container">
            
            <section class="card" id="interactive-card">
                <h3>Координатная плоскость</h3>
                
                <canvas id="graph-canvas" width="360" height="360"></canvas>

                <form id="check-form">
                    <div class="form-group">
                        <label for="x-select">Координата X:</label>
                        <select id="x-select" class="form-control-input">
                            <option value="" disabled selected>Выберите X</option>
                            <option value="-4">-4</option>
                            <option value="-3">-3</option>
                            <option value="-2">-2</option>
                            <option value="-1">-1</option>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                        <div id="x-error" class="error-message">Выберите значение X</div>
                    </div>

                    <div class="form-group">
                        <label for="y-input">Координата Y (-3 ... 5):</label>
                        <input type="text" id="y-input" class="form-control-input" placeholder="Число от -3 до 5" autocomplete="off">
                        <div id="y-error" class="error-message">Введите число в интервале (-3 ... 5)</div>
                    </div>

                    <div class="form-group">
                        <label>Радиус R:</label>
                        <div class="checkbox-group">
                            <label class="checkbox-item"><input type="checkbox" name="r-check" value="1">1</label>
                            <label class="checkbox-item"><input type="checkbox" name="r-check" value="1.5">1.5</label>
                            <label class="checkbox-item"><input type="checkbox" name="r-check" value="2" checked>2</label>
                            <label class="checkbox-item"><input type="checkbox" name="r-check" value="2.5">2.5</label>
                            <label class="checkbox-item"><input type="checkbox" name="r-check" value="3">3</label>
                        </div>
                        <div id="r-error" class="error-message">Выберите одно значение R</div>
                    </div>

                    <button type="submit" class="btn-submit">Проверить точку</button>
                </form>
            </section>

            <section class="card" id="results-card">
                <div class="results-header">
                    <h3>История проверок</h3>
                    <button id="clear-btn" class="btn-clear" type="button">Очистить историю</button>
                </div>
                
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>X</th>
                            <th>Y</th>
                            <th>R</th>
                            <th>Результат</th>
                            <th>Дата и время</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
